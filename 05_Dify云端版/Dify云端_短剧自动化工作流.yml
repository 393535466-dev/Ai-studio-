app:
  description: 短剧分镜编排。输入剧本，本地 Qwen3-4B 拆成结构化分镜 JSON，代码节点强制端侧边界 （竖屏 9:16、单镜头 ≤5s、图先行），再提交本机关键帧生成 API。视频渲染须审片通过后另行触发。
  icon: 🎬
  icon_background: '#E0E7FF'
  mode: workflow
  name: 端侧AIStudio_短剧自动化工作流_云端演示版
  use_icon_as_answer_icon: false
kind: app
version: 0.1.5
workflow:
  conversation_variables: []
  environment_variables:
  - description: 云端演示默认值：httpbin 回显服务（POST 返回 200），用于验证整条链路连通。接真实出图服务时把它换成你的公网地址即可，例如 https://xxxx.ngrok-free.app；正式作业方案仍为纯本地链路。
    id: env-api-base-0001
    name: API_BASE
    selector:
    - env
    - API_BASE
    value: https://httpbin.org/anything
    value_type: string
  features:
    file_upload:
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        sourceType: start
        targetType: llm
      id: 1770000002001-source-1770000002002-target
      source: '1770000002001'
      sourceHandle: source
      target: '1770000002002'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: llm
        targetType: code
      id: 1770000002002-source-1770000002003-target
      source: '1770000002002'
      sourceHandle: source
      target: '1770000002003'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: code
        targetType: http-request
      id: 1770000002003-source-1770000002004-target
      source: '1770000002003'
      sourceHandle: source
      target: '1770000002004'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: http-request
        targetType: end
      id: 1770000002004-source-1770000002005-target
      source: '1770000002004'
      sourceHandle: source
      target: '1770000002005'
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: 剧本与端侧边界参数。输入即 API 的 inputs 字段。
        selected: false
        title: 开始 · 剧本与边界
        type: start
        variables:
        - label: 剧本文本
          max_length: 4000
          options: []
          required: true
          type: paragraph
          variable: script
        - label: 分镜数量上限
          options:
          - '4'
          - '6'
          - '8'
          required: true
          type: select
          variable: shot_count
        - label: 输出档位
          options:
          - 480p 预演
          - 720p 终稿
          required: true
          type: select
          variable: resolution
        - label: 角色锚定
          options:
          - 每镜头 re-anchor（推荐）
          - 关闭（会产生身份漂移）
          required: true
          type: select
          variable: anchor_lock
      height: 180
      id: '1770000002001'
      position:
        x: 60
        y: 260
      positionAbsolute:
        x: 60
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 云端演示版：默认已选 DeepSeek 的 deepseek-flash（你账号已配深度求索密钥）。如果你的账号接的是别的模型，打开本节点在模型下拉里换即可。提示词与本地版完全一致。
        model:
          completion_params:
            max_tokens: 1400
            temperature: 0.2
          mode: chat
          name: deepseek-flash
          provider: langgenius/deepseek/deepseek
        prompt_template:
        - id: sys-drama-0001
          role: system
          text: "你是端侧 AI Studio 的短剧分镜编排器。把剧本拆成可直接出图的结构化分镜。\n必须只输出一个合法 JSON 对象，不要 Markdown 代码块、不要解释、不要多余文字。\nJSON 结构固定如下：\n{\n  \"plan_id\": \"字符串，形如 drama-<8位数字>\",\n  \"engine\": \"Z-Image-Turbo Q5_K_S\"\
            ,\n  \"boundary\": \"竖屏 9:16 / 单镜头 ≤5s / 图先行 / I2V 5 帧段\",\n  \"characters\": [\"角色名\"],\n  \"shots\": [\n    {\"scene\":\"景别，如 中景 / 近景 / 全景\",\n     \"action\":\"一到两句的动作与情绪描述\",\n     \"dur\"\
            : 整数秒,\n     \"prompt\":\"英文关键帧提示词，必须含角色名与锚图引用\",\n     \"camera\":\"固定 / 缓推 / 手持\",\n     \"identity_ref\":\"原始角色锚图\"}\n  ]\n}\n硬约束：每个镜头 dur 不得大于 5（端侧只能出 5 秒片段）；\nidentity_ref 一律写「原始角色锚图」，禁止用上一镜头输出当参考（会身份漂移）；\n\
            不生成长镜头、不生成 1080p、不生成需要云端视频模型的任务；\nshots 数量等于用户给的分镜数量上限。"
        - id: usr-drama-0001
          role: user
          text: 剧本：{{#1770000002001.script#}} 分镜数量上限：{{#1770000002001.shot_count#}} 输出档位：{{#1770000002001.resolution#}} 角色锚定：{{#1770000002001.anchor_lock#}}
        selected: false
        title: LLM · 剧本拆为结构化分镜
        type: llm
        variables: []
        vision:
          enabled: false
      height: 98
      id: '1770000002002'
      position:
        x: 360
        y: 260
      positionAbsolute:
        x: 360
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "import json\nimport re\n\n\ndef extract_plan(text):\n    # 容错解析：兼容 Markdown 围栏、前后解释文字、尾随逗号\n    s = (text or \"\").strip()\n    s = re.sub(r\"^```(?:json)?\\s*\", \"\", s)\n    s = re.sub(r\"\
          \\s*```$\", \"\", s).strip()\n    try:\n        return json.loads(s)\n    except Exception:\n        pass\n    i, j = s.find(\"{\"), s.rfind(\"}\")\n    if i >= 0 and j > i:\n        for cand\
          \ in (s[i:j+1], re.sub(r\",\\s*([}\\]])\", r\"\\1\", s[i:j+1])):\n            try:\n                return json.loads(cand)\n            except Exception:\n                pass\n    return None\n\
          \n\ndef main(llm_text, shot_count, resolution, anchor_lock):\n    raw_text = llm_text or \"\"\n    plan = extract_plan(raw_text)\n    parsed_ok = plan is not None\n    if plan is None:\n     \
          \   # 本地规则兜底，绝不调用云端模型重试\n        n = int(shot_count or 6)\n        plan = {\n            \"plan_id\": \"drama-fallback\",\n            \"engine\": \"Z-Image-Turbo Q5_K_S\",\n            \"boundary\"\
          : \"竖屏 9:16 / 单镜头 ≤5s / 图先行\",\n            \"characters\": [\"林夏\", \"陈屿\"],\n            \"shots\": [\n                {\"scene\": \"中景\", \"action\": \"两人对视，情绪克制\", \"dur\": 4,\n          \
          \       \"prompt\": \"cinematic still, two characters, anchored reference\",\n                 \"camera\": \"固定\", \"identity_ref\": \"原始角色锚图\"}\n                for _ in range(n)\n          \
          \  ],\n        }\n    n = int(shot_count or len(plan.get(\"shots\", [])) or 6)\n    shots = plan.get(\"shots\", [])[:n]\n    for s in shots:\n        # 端侧边界在代码里强制落地，不信任模型自觉\n        s[\"dur\"\
          ] = min(int(s.get(\"dur\", 4) or 4), 5)\n        s[\"identity_ref\"] = \"原始角色锚图\"\n        s.setdefault(\"scene\", \"中景\")\n        s.setdefault(\"action\", \"情绪延续\")\n        s.setdefault(\"\
          prompt\", \"cinematic still, anchored reference\")\n        s.setdefault(\"camera\", \"固定\")\n        s[\"stage\"] = \"keyframe\"\n    plan[\"shots\"] = shots\n    plan[\"boundary\"] = \"竖屏 9:16\
          \ / 单镜头 ≤5s / 图先行 / I2V 5 帧段（无云端兜底）\"\n    drift = \"关闭\" in (anchor_lock or \"\")\n    request = {\n        \"plan_id\": plan.get(\"plan_id\", \"drama-local\"),\n        \"scene\": \"drama\"\
          ,\n        \"engine\": \"Z-Image-Turbo Q5_K_S\",\n        \"resolution\": resolution,\n        \"anchor_lock\": not drift,\n        \"local_only\": True,\n        \"stage\": \"keyframe\",\n  \
          \      \"tasks\": shots,\n    }\n    summary = \"本地编排完成：%d 个镜头，均 ≤5s，图先行排队关键帧，re-anchor=%s\" % (\n        len(shots), \"关\" if drift else \"开\")\n    if not parsed_ok:\n        summary += \" [diag]\
          \ llm_len=%d head=%r\" % (len(raw_text), raw_text[:80])\n    return {\n        \"plan_json\": json.dumps(plan, ensure_ascii=False),\n        \"request_json\": json.dumps(request, ensure_ascii=False),\n\
          \        \"shot_count\": len(shots),\n        \"summary\": summary,\n    }\n"
        code_language: python3
        desc: 结构化输出的护栏 + 端侧边界的强制执行点。模型可能被剧本带偏写出长镜头， 所以时长裁剪、身份锚定、图先行策略都在这里硬性落地。
        outputs:
          plan_json:
            children: null
            type: string
          request_json:
            children: null
            type: string
          shot_count:
            children: null
            type: number
          summary:
            children: null
            type: string
        selected: false
        title: 代码 · 分镜校验与端侧裁剪
        type: code
        variables:
        - value_selector:
          - '1770000002002'
          - text
          variable: llm_text
        - value_selector:
          - '1770000002001'
          - shot_count
          variable: shot_count
        - value_selector:
          - '1770000002001'
          - resolution
          variable: resolution
        - value_selector:
          - '1770000002001'
          - anchor_lock
          variable: anchor_lock
      height: 54
      id: '1770000002003'
      position:
        x: 660
        y: 260
      positionAbsolute:
        x: 660
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data:
          - id: kv-drama-body
            key: ''
            type: text
            value: '{{#1770000002003.request_json#}}'
          type: json
        desc: 云端版目标地址抽成了环境变量 API_BASE（工作流右上角「环境变量」里改）。云端 Dify 访问不到 127.0.0.1，需要把本机 local_api_server.py 通过内网穿透（ngrok 等）或部署到公网后再填。
        headers: 'Content-Type: application/json'
        method: post
        params: ''
        selected: false
        timeout:
          max_connect_timeout: 10
          max_read_timeout: 120
          max_write_timeout: 10
        title: HTTP · 提交本地关键帧任务
        type: http-request
        url: '{{#env.API_BASE#}}/api/drama/generate'
        variables: []
      height: 110
      id: '1770000002004'
      position:
        x: 960
        y: 260
      positionAbsolute:
        x: 960
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: data.outputs 即回给审片台的结构化分镜与排队结果。
        outputs:
        - value_selector:
          - '1770000002003'
          - plan_json
          variable: plan
        - value_selector:
          - '1770000002004'
          - body
          variable: generate_result
        - value_selector:
          - '1770000002003'
          - summary
          variable: summary
        - value_selector:
          - '1770000002003'
          - shot_count
          variable: shot_count
        selected: false
        title: 结束 · 回传审片台
        type: end
      height: 90
      id: '1770000002005'
      position:
        x: 1260
        y: 260
      positionAbsolute:
        x: 1260
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 40
      y: 60
      zoom: 0.75
