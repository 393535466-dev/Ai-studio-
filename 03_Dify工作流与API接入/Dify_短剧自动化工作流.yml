# =============================================================================
# 端侧 AI Studio · 短剧自动化工作流（Dify DSL，可直接导入）
# 适用：Dify 自部署版（Community Edition）· mode: workflow
# 链路：开始 → 本地 LLM 拆分镜 → 代码节点裁剪端侧边界 → HTTP 调本地关键帧 API → 结束
# 红线：图先行（先关键帧审片，再 I2V），单镜头 ≤5s，无云端模型 / 无云端视频兜底
# 导入后必做：在 LLM 节点重新选一次本地模型（Ollama / vLLM / LocalAI）
# =============================================================================
app:
  description: 短剧分镜编排。输入剧本，本地 Qwen3-4B 拆成结构化分镜 JSON，代码节点强制端侧边界
    （竖屏 9:16、单镜头 ≤5s、图先行），再提交本机关键帧生成 API。视频渲染须审片通过后另行触发。
  icon: "\U0001F3AC"
  icon_background: '#E0E7FF'
  mode: workflow
  name: 端侧AIStudio_短剧自动化工作流
  use_icon_as_answer_icon: false
kind: app
version: 0.1.5
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        sourceType: start
        targetType: llm
      id: 1770000002001-source-1770000002002-target
      source: '1770000002001'
      sourceHandle: source
      target: '1770000002002'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: llm
        targetType: code
      id: 1770000002002-source-1770000002003-target
      source: '1770000002002'
      sourceHandle: source
      target: '1770000002003'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: code
        targetType: http-request
      id: 1770000002003-source-1770000002004-target
      source: '1770000002003'
      sourceHandle: source
      target: '1770000002004'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: http-request
        targetType: end
      id: 1770000002004-source-1770000002005-target
      source: '1770000002004'
      sourceHandle: source
      target: '1770000002005'
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: 剧本与端侧边界参数。输入即 API 的 inputs 字段。
        selected: false
        title: 开始 · 剧本与边界
        type: start
        variables:
        - label: 剧本文本
          max_length: 4000
          options: []
          required: true
          type: paragraph
          variable: script
        - label: 分镜数量上限
          options:
          - label: '4'
            value: '4'
          - label: '6'
            value: '6'
          - label: '8'
            value: '8'
          required: true
          type: select
          variable: shot_count
        - label: 输出档位
          options:
          - label: 480p 预演
            value: 480p 预演
          - label: 720p 终稿
            value: 720p 终稿
          required: true
          type: select
          variable: resolution
        - label: 角色锚定
          options:
          - label: 每镜头 re-anchor（推荐）
            value: 每镜头 re-anchor（推荐）
          - label: 关闭（会产生身份漂移）
            value: 关闭（会产生身份漂移）
          required: true
          type: select
          variable: anchor_lock
      height: 180
      id: '1770000002001'
      position:
        x: 60
        y: 260
      positionAbsolute:
        x: 60
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 本地 Qwen3-4B（Ollama）。把剧本拆成结构化分镜；端侧跑不动长视频，
          所以提示词里直接把「单镜头 ≤5s、图先行」写成硬约束。
        model:
          completion_params:
            max_tokens: 1800
            temperature: 0.3
          mode: chat
          name: qwen3:4b
          provider: ollama
        prompt_template:
        - id: sys-drama-0001
          role: system
          text: |-
            你是端侧 AI Studio 的短剧分镜编排器。把剧本拆成可直接出图的结构化分镜。
            必须只输出一个合法 JSON 对象，不要 Markdown 代码块、不要解释、不要多余文字。
            JSON 结构固定如下：
            {
              "plan_id": "字符串，形如 drama-<8位数字>",
              "engine": "Z-Image-Turbo Q5_K_S",
              "boundary": "竖屏 9:16 / 单镜头 ≤5s / 图先行 / I2V 5 帧段",
              "characters": ["角色名"],
              "shots": [
                {"scene":"景别，如 中景 / 近景 / 全景",
                 "action":"一到两句的动作与情绪描述",
                 "dur": 整数秒,
                 "prompt":"英文关键帧提示词，必须含角色名与锚图引用",
                 "camera":"固定 / 缓推 / 手持",
                 "identity_ref":"原始角色锚图"}
              ]
            }
            硬约束：每个镜头 dur 不得大于 5（端侧只能出 5 秒片段）；
            identity_ref 一律写「原始角色锚图」，禁止用上一镜头输出当参考（会身份漂移）；
            不生成长镜头、不生成 1080p、不生成需要云端视频模型的任务；
            shots 数量等于用户给的分镜数量上限。
        - id: usr-drama-0001
          role: user
          text: '剧本：{{#1770000002001.script#}}
            分镜数量上限：{{#1770000002001.shot_count#}}
            输出档位：{{#1770000002001.resolution#}}
            角色锚定：{{#1770000002001.anchor_lock#}}'
        selected: false
        title: 本地 LLM · 剧本拆为结构化分镜
        type: llm
        variables: []
        vision:
          enabled: false
      height: 98
      id: '1770000002002'
      position:
        x: 360
        y: 260
      positionAbsolute:
        x: 360
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: |-
          import json
          import re

          def main(llm_text, shot_count, resolution, anchor_lock):
              raw = (llm_text or "").strip()
              raw = re.sub(r"^```(?:json)?", "", raw).strip()
              raw = re.sub(r"```$", "", raw).strip()
              try:
                  plan = json.loads(raw)
              except Exception:
                  # 本地规则兜底，绝不调用云端模型重试
                  n = int(shot_count or 6)
                  plan = {
                      "plan_id": "drama-fallback",
                      "engine": "Z-Image-Turbo Q5_K_S",
                      "boundary": "竖屏 9:16 / 单镜头 ≤5s / 图先行",
                      "characters": ["林夏", "陈屿"],
                      "shots": [
                          {"scene": "中景", "action": "两人对视，情绪克制", "dur": 4,
                           "prompt": "cinematic still, two characters, anchored reference",
                           "camera": "固定", "identity_ref": "原始角色锚图"}
                          for _ in range(n)
                      ],
                  }
              n = int(shot_count or len(plan.get("shots", [])) or 6)
              shots = plan.get("shots", [])[:n]
              for s in shots:
                  # 端侧边界在代码里强制落地，不信任模型自觉
                  s["dur"] = min(int(s.get("dur", 4) or 4), 5)
                  s["identity_ref"] = "原始角色锚图"
                  s.setdefault("scene", "中景")
                  s.setdefault("action", "情绪延续")
                  s.setdefault("prompt", "cinematic still, anchored reference")
                  s.setdefault("camera", "固定")
                  s["stage"] = "keyframe"   # 图先行：本轮只排队关键帧，不启动视频
              plan["shots"] = shots
              plan["boundary"] = "竖屏 9:16 / 单镜头 ≤5s / 图先行 / I2V 5 帧段（无云端兜底）"
              drift = "关闭" in (anchor_lock or "")
              request = {
                  "plan_id": plan.get("plan_id", "drama-local"),
                  "scene": "drama",
                  "engine": "Z-Image-Turbo Q5_K_S",
                  "resolution": resolution,
                  "anchor_lock": not drift,
                  "local_only": True,
                  "stage": "keyframe",
                  "tasks": shots,
              }
              return {
                  "plan_json": json.dumps(plan, ensure_ascii=False),
                  "request_json": json.dumps(request, ensure_ascii=False),
                  "shot_count": len(shots),
                  "summary": "本地编排完成：%d 个镜头，均 ≤5s，图先行排队关键帧，re-anchor=%s"
                             % (len(shots), "关" if drift else "开"),
              }
        code_language: python3
        desc: 结构化输出的护栏 + 端侧边界的强制执行点。模型可能被剧本带偏写出长镜头，
          所以时长裁剪、身份锚定、图先行策略都在这里硬性落地。
        outputs:
          plan_json:
            children: null
            type: string
          request_json:
            children: null
            type: string
          shot_count:
            children: null
            type: number
          summary:
            children: null
            type: string
        selected: false
        title: 代码 · 分镜校验与端侧裁剪
        type: code
        variables:
        - value_selector:
          - '1770000002002'
          - text
          variable: llm_text
        - value_selector:
          - '1770000002001'
          - shot_count
          variable: shot_count
        - value_selector:
          - '1770000002001'
          - resolution
          variable: resolution
        - value_selector:
          - '1770000002001'
          - anchor_lock
          variable: anchor_lock
      height: 54
      id: '1770000002003'
      position:
        x: 660
        y: 260
      positionAbsolute:
        x: 660
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data:
          - id: kv-drama-body
            key: ''
            type: text
            value: '{{#1770000002003.request_json#}}'
          type: json
        desc: 只提交关键帧任务。视频 I2V 要等审片通过后由创作应用另行触发，
          避免把昂贵算力花在会被打回的镜头上。
        headers: 'Content-Type: application/json'
        method: post
        params: ''
        selected: false
        timeout:
          max_connect_timeout: 10
          max_read_timeout: 120
          max_write_timeout: 10
        title: HTTP · 提交本地关键帧任务
        type: http-request
        url: http://host.docker.internal:8765/api/drama/generate
        variables: []
      height: 110
      id: '1770000002004'
      position:
        x: 960
        y: 260
      positionAbsolute:
        x: 960
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: data.outputs 即回给审片台的结构化分镜与排队结果。
        outputs:
        - value_selector:
          - '1770000002003'
          - plan_json
          variable: plan
        - value_selector:
          - '1770000002004'
          - body
          variable: generate_result
        - value_selector:
          - '1770000002003'
          - summary
          variable: summary
        - value_selector:
          - '1770000002003'
          - shot_count
          variable: shot_count
        selected: false
        title: 结束 · 回传审片台
        type: end
      height: 90
      id: '1770000002005'
      position:
        x: 1260
        y: 260
      positionAbsolute:
        x: 1260
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 40
      y: 60
      zoom: 0.75
